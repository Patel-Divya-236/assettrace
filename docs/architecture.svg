<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="44" font-size="26" font-weight="700" fill="#111827">AssetTrace — architecture</text>
  <text x="30" y="72" font-size="15" fill="#4b5563">Users → one web app → one stateless API → one database. Only the API touches the database.</text>

  <!-- Column 1: users -->
  <g font-size="14" fill="#1f2937">
    <rect x="30" y="120" width="220" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="46" y="150" font-size="17" font-weight="700" fill="#1e3a8a">Staff</text>
    <text x="46" y="176">Admin · Officer</text>
    <text x="46" y="196">Field officer · Viewer</text>
    <text x="46" y="216" fill="#4b5563">login with email</text>

    <rect x="30" y="260" width="220" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="46" y="290" font-size="17" font-weight="700" fill="#1e3a8a">Citizen</text>
    <text x="46" y="316">login with mobile</text>
    <text x="46" y="336">files complaints</text>
    <text x="46" y="356" fill="#4b5563">sees "My complaints"</text>

    <rect x="30" y="400" width="220" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="46" y="430" font-size="17" font-weight="700" fill="#1e3a8a">Public (no login)</text>
    <text x="46" y="456">scans QR on the asset</text>
    <text x="46" y="476">sees Working / Repair</text>
    <text x="46" y="496" fill="#4b5563">tracks a report number</text>
  </g>

  <!-- Column 2: web app -->
  <g font-size="14" fill="#1f2937">
    <rect x="300" y="120" width="210" height="390" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="316" y="152" font-size="17" font-weight="700" fill="#064e3b">Web app</text>
    <text x="316" y="178">React + Vite + Tailwind</text>
    <text x="316" y="198" fill="#4b5563">hosted on Vercel</text>
    <line x1="316" y1="216" x2="494" y2="216" stroke="#a7f3d0"/>
    <text x="316" y="244">staff screens</text>
    <text x="316" y="266">citizen screens</text>
    <text x="316" y="288">public screens</text>
    <line x1="316" y1="306" x2="494" y2="306" stroke="#a7f3d0"/>
    <text x="316" y="334">mobile-first</text>
    <text x="316" y="356">Gujarati · Hindi · English</text>
    <text x="316" y="378">status = icon + colour + word</text>
    <text x="316" y="400">map: Leaflet + OSM</text>
    <line x1="316" y1="418" x2="494" y2="418" stroke="#a7f3d0"/>
    <text x="316" y="446" fill="#4b5563">shows only the buttons</text>
    <text x="316" y="466" fill="#4b5563">the API allows —</text>
    <text x="316" y="486" fill="#4b5563">no business rules here</text>
  </g>

  <!-- Column 3: API -->
  <g font-size="14" fill="#1f2937">
    <rect x="570" y="100" width="330" height="460" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="586" y="132" font-size="17" font-weight="700" fill="#7c2d12">Express API</text>
    <text x="586" y="156" fill="#4b5563">Node + TypeScript · Vercel Function</text>
    <text x="586" y="176" fill="#4b5563">stateless (JWT) → can run many copies</text>

    <rect x="586" y="194" width="298" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="600" y="214" font-weight="700">/api — staff</text>
    <text x="600" y="232" fill="#4b5563">JWT + role check on every route</text>

    <rect x="586" y="250" width="298" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="600" y="270" font-weight="700">/api/citizen — complaints</text>
    <text x="600" y="288" fill="#4b5563">citizen JWT, refused on staff routes</text>

    <rect x="586" y="306" width="298" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="600" y="326" font-weight="700">/api/public — read only</text>
    <text x="600" y="344" fill="#4b5563">rate-limited per IP, safe fields only</text>

    <rect x="586" y="376" width="298" height="62" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="600" y="398" font-weight="700">Modules</text>
    <text x="600" y="418" fill="#4b5563">asset types · assets · tickets · reports</text>
    <text x="600" y="434" fill="#4b5563">CSV import · dashboard · QR</text>

    <rect x="586" y="462" width="298" height="82" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="486" font-weight="700" fill="#7c2d12">Lifecycle engine</text>
    <text x="600" y="506">the only code that changes asset.status</text>
    <text x="600" y="526" fill="#4b5563">one transaction: status + event + audit</text>

    <!-- inside-API arrows -->
    <line x1="735" y1="352" x2="735" y2="374" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="735" y1="438" x2="735" y2="460" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Column 4: database -->
  <g font-size="14" fill="#1f2937">
    <path d="M950,200 L950,460 A110,18 0 0 0 1170,460 L1170,200" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <ellipse cx="1060" cy="200" rx="110" ry="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="966" y="250" font-size="17" font-weight="700" fill="#4c1d95">PostgreSQL</text>
    <text x="966" y="272" fill="#4b5563">Neon · via Prisma 6</text>
    <line x1="966" y1="290" x2="1154" y2="290" stroke="#ddd6fe"/>
    <text x="966" y="316">custom fields as JSONB</text>
    <text x="966" y="336">+ GIN index</text>
    <text x="966" y="364">insert-only history:</text>
    <text x="966" y="384">LifecycleEvent, AuditLog</text>
    <text x="966" y="412">report photos as bytes</text>
    <text x="966" y="432" fill="#4b5563">(no server files)</text>
  </g>

  <!-- Arrows between columns -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <line x1="250" y1="175" x2="298" y2="175" marker-end="url(#arrow)"/>
    <line x1="250" y1="315" x2="298" y2="315" marker-end="url(#arrow)"/>
    <line x1="250" y1="455" x2="298" y2="455" marker-end="url(#arrow)"/>
    <line x1="510" y1="315" x2="568" y2="315" marker-end="url(#arrow)"/>
    <line x1="900" y1="330" x2="948" y2="330" marker-end="url(#arrow)"/>
  </g>
  <text x="539" y="303" font-size="13" fill="#374151" text-anchor="middle">HTTPS</text>
  <text x="539" y="335" font-size="13" fill="#374151" text-anchor="middle">JSON</text>
  <text x="924" y="318" font-size="13" fill="#374151" text-anchor="middle">SQL</text>

  <!-- Footer -->
  <text x="30" y="596" font-size="14" fill="#4b5563">Citizens and the public can never change an asset's stage: a complaint goes to a queue, a field officer confirms it,</text>
  <text x="30" y="618" font-size="14" fill="#4b5563">and only then does the lifecycle engine move the asset to "under repair".</text>
</svg>
