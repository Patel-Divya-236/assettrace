# Render Blueprint: creates the API web service and its Postgres database in one go.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: assettrace-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: assettrace-db
          property: connectionString # internal URL, only reachable inside Render
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Filled in by hand after the Vercel deploy (the domain is not known yet).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: assettrace-db
    plan: free
    databaseName: assettrace
    user: assettrace
    postgresMajorVersion: "16"
